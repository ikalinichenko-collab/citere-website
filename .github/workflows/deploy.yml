name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      # The custom domain citere.ai is live (CNAME), so GitHub Pages serves the
      # site from the domain root and redirects the github.io subpath to it.
      # Defaults are therefore the production values; override via the repository
      # variables PATH_PREFIX / CANONICAL_URL only for a subpath/preview deploy.
      # CANONICAL_URL is the host that goes into canonical, hreflang and JSON-LD;
      # while data/site.json carries demo:true, check.mjs refuses to build demo
      # figures under the production host.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/' }}
          CANONICAL_URL: ${{ vars.CANONICAL_URL || 'https://citere.ai' }}
      - run: npm run check
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/' }}
          CANONICAL_URL: ${{ vars.CANONICAL_URL || 'https://citere.ai' }}
      # CLAUDE.md 10: Lighthouse >= 95 in all four categories on the homepage,
      # one claim page, the registry and one report. npm run lighthouse builds
      # its own copy into _site-lighthouse/ at the root prefix (where the
      # custom domain will serve it) and never touches _site/ - that build,
      # from the prefixed step above, is what gets deployed below. An earlier
      # version of this step ran `npm run build` again to reset the prefix,
      # which overwrote the prefixed _site/ with an unprefixed one right
      # before the upload, breaking the GitHub Pages subpath deploy.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
